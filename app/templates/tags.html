{% extends "base.html" %}
{% block title %}标签 · 校园笔记分享{% endblock %}
{% block content %}
<h2 class="mb-3">全部标签</h2>
<div class="card shadow-sm"><div class="card-body">
  {% for tag in tags %}
  <a class="btn btn-outline-secondary btn-sm m-1" href="{{ url_for('posts.index', tag=tag.name) }}">
    {{ tag.name }} <span class="badge text-bg-primary">{{ tag.posts | length }}</span>
  </a>
  {% else %}
  <p class="text-muted mb-0">暂无标签。</p>
  {% endfor %}
</div></div>
{% endblock %}
