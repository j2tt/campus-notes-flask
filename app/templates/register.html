{% extends "base.html" %}
{% block title %}注册 · 校园笔记分享{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
<div class="card shadow-sm"><div class="card-body">
  <h3 class="card-title mb-3">注册</h3>
  <form method="post">
    <div class="mb-3"><label class="form-label">用户名</label>
      <input name="username" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">邮箱</label>
      <input name="email" type="email" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">密码</label>
      <input name="password" type="password" class="form-control" required></div>
    <button class="btn btn-primary w-100">注册</button>
  </form>
  <p class="mt-3 mb-0 text-muted">已有账号？<a href="{{ url_for('auth.login') }}">去登录</a></p>
</div></div>
</div></div>
{% endblock %}
